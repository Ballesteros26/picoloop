name: build-windows  
  
on:  
  push:  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install MinGW toolchain  
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 curl tar  
  
      - name: Fetch SDL2 for MinGW  
        working-directory: picoloop  
        run: sh platform/windows/fetch_sdl2.sh  
  
      - name: Build picoloop for Windows x64  
        working-directory: picoloop  
        run: make -f Makefile.PatternPlayer_windows_mingw_SDL2_64bit -j"$(nproc)"  
  
      - name: Package executable and DLLs  
        working-directory: picoloop  
        run: mkdir -p dist && cp picoloop_windows_mingw_SDL2_64bit.exe dist/ && cp SDL2_windows/bin64/*.dll dist/ && cp picoloop.ini.example dist/picoloop.ini  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: picoloop-win10-x64  
          path: picoloop/dist/
